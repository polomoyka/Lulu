<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Товари — Lulu</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;500;600;700;800&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="logo"><div class="logo-icon">☁️</div><span>Lulu</span></div>
      <nav class="nav" id="navMenu"></nav>
    </aside>

    <main class="main">
      <div class="topbar">
        <div class="greeting">
          <h1>Товари</h1>
          <p>Управління асортиментом магазину</p>
        </div>
        <div class="user">
          <span id="userName"></span>
          <div class="avatar">👤</div>
          <button onclick="logout()" class="btn" style="background:#fee2e2; color:#dc2626; padding:6px 14px;">Вийти</button>
        </div>
      </div>

      <div id="content"></div>
    </main>
  </div>

  <script src="script.js"></script>
  <script>
    const user = checkAuth(['manager', 'cashier', 'warehouse']);
    updateUserInfo();
    renderNav('products');

    let products = [];
    let categories = [];
    let suppliers = [];

    async function loadData() {
      try {
        products = await apiRequest('/products');
        categories = await apiRequest('/categories');
        suppliers = await apiRequest('/suppliers');
        renderProducts();
      } catch (err) {
        alert(err.message);
      }
    }

    function renderProducts() {
      const canAdd = ['manager', 'warehouse'].includes(user.role);
      const canDelete = user.role === 'manager';

      document.getElementById('content').innerHTML = `
        <div class="card">
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <h3>📦 Список товарів</h3>
            ${canAdd ? `<button class="btn primary add-product-btn" onclick="openModal()">+ Додати товар</button>` : ''}
          </div>

          <div class="product-grid-list">
            ${
              products.length
                ? products.map(p => {
                  const status = getProductStatus(p);
                  const statusText = status === 'normal'
                    ? '✔️ В наявності'
                    : status === 'low'
                      ? '⚠️ Малий залишок'
                      : '❌ Немає';

                  return `
                    <div class="product-row">
                      <div class="product-info">
                        <strong>${p.name}</strong>
                        <span>${p.category_name || '-'}</span>
                        <span>💰 ${p.price}₴</span>
                        <span>📦 ${p.quantity} шт</span>
                        <span>🏭 ${p.supplier_name || '-'}</span>
                        <span>${statusText}</span>
                      </div>

                      <div class="product-actions">
                        ${canDelete ? `<button class="btn danger" onclick="deleteProduct(${p.id})">Видалити</button>` : ''}
                      </div>
                    </div>
                  `;
                }).join('')
                : '<p>Немає товарів</p>'
            }
          </div>
        </div>

        <div id="productModal" class="modal">
          <div class="modal-content">
            <div class="modal-header">
              <h3>➕ Додати товар</h3>
              <button onclick="closeModal()" style="background:none; border:none; font-size:24px;">&times;</button>
            </div>

            <form onsubmit="saveProduct(event)">
              <div class="form-group">
                <label>Назва</label>
                <input type="text" id="prodName" class="custom-input" required>
              </div>

              <div class="form-group">
                <label>Штрихкод</label>
                <input type="text" id="prodBarcode" class="custom-input">
              </div>

              <div class="form-row">
                <div class="form-group">
                  <label>Категорія</label>
                  <select id="prodCategory" class="custom-select">
                    ${categories.map(c => `<option value="${c.id}">${c.name}</option>`).join('')}
                  </select>
                </div>

                <div class="form-group">
                  <label>Постачальник</label>
                  <select id="prodSupplier" class="custom-select">
                    ${suppliers.map(s => `<option value="${s.id}">${s.name}</option>`).join('')}
                  </select>
                </div>
              </div>

              <div class="form-row">
                <div class="form-group">
                  <label>Ціна (грн)</label>
                  <input type="number" step="0.01" min="0.01" id="prodPrice" class="custom-input" required>
                </div>

                <div class="form-group">
                  <label>Кількість</label>
                  <input type="number" min="0" id="prodQuantity" class="custom-input" value="0">
                </div>
              </div>

              <div class="form-row">
                <div class="form-group">
                  <label>Мін. залишок</label>
                  <input type="number" min="0" id="prodMinQuantity" class="custom-input" value="5">
                </div>

                <div class="form-group">
                  <label>Собівартість</label>
                  <input type="number" step="0.01" min="0" id="prodCostPrice" class="custom-input" value="0">
                </div>
              </div>

              <button type="submit" class="btn primary" style="width:100%">💾 Зберегти</button>
            </form>
          </div>
        </div>
      `;
    }

    window.openModal = () => {
      document.getElementById('productModal').style.display = 'flex';
    };

    window.closeModal = () => {
      document.getElementById('productModal').style.display = 'none';
    };

    window.saveProduct = async (e) => {
      e.preventDefault();

      try {
        await apiRequest('/products', {
          method: 'POST',
          body: JSON.stringify({
            name: document.getElementById('prodName').value,
            barcode: document.getElementById('prodBarcode').value,
            category_id: Number(document.getElementById('prodCategory').value),
            supplier_id: Number(document.getElementById('prodSupplier').value),
            price: Number(document.getElementById('prodPrice').value),
            cost_price: Number(document.getElementById('prodCostPrice').value || 0),
            quantity: Number(document.getElementById('prodQuantity').value || 0),
            min_quantity: Number(document.getElementById('prodMinQuantity').value || 5)
          })
        });

        closeModal();
        await loadData();
      } catch (err) {
        alert(err.message);
      }
    };

    window.deleteProduct = async (id) => {
      if (!confirm('Видалити товар?')) return;

      try {
        await apiRequest(`/products/${id}`, { method: 'DELETE' });
        await loadData();
      } catch (err) {
        alert(err.message);
      }
    };

    loadData();
  </script>
</body>
</html>
